<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard | ไฟล์เสียง Roleplay (Modern)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    
    <style>
        :root {
            --primary-color: #2e8b57; /* Sea Green - สีเขียวที่ดูเป็นมืออาชีพ */
            --secondary-color: #f4f7f6;
        }

        body {
            background-color: var(--secondary-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container-main {
            padding-top: 30px;
            padding-bottom: 30px;
            flex-grow: 1;
        }
        
        /* Style สำหรับ Login Page */
        #loginPage {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color) 0%, #3cb371 100%);
        }
        
        .login-card {
            max-width: 400px;
            width: 90%;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Style สำหรับ Dashboard Navbar */
        .navbar-custom {
            border-bottom: 3px solid var(--primary-color);
        }

        /* Style สำหรับ Dashboard Card */
        .submission-card {
            border-left: 5px solid var(--primary-color); /* เส้นสีเขียวเด่น */
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: all 0.3s ease-in-out;
        }
        
        .submission-card:hover {
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transform: translateY(-5px);
        }
        
        .audio-player {
            background-color: #e9ecef;
            border-radius: 5px;
            padding: 5px;
        }

        .text-primary-custom {
            color: var(--primary-color) !important;
        }
        .bg-primary-custom {
            background-color: var(--primary-color) !important;
        }
    </style>
</head>
<body>

    <div id="loginPage">
        <div class="card login-card">
            <div class="card-body">
                <h4 class="card-title text-center mb-4 text-primary-custom"><i class="bi bi-person-lock me-2"></i>เข้าสู่ระบบ Dashboard</h4>
                <div id="loginMessage" class="alert alert-danger" style="display:none;"></div>
                <div class="mb-3">
                    <label for="username" class="form-label">ชื่อผู้ใช้</label>
                    <input type="text" class="form-control" id="username" value="Trainer" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">รหัสผ่าน</label>
                    <input type="password" class="form-control" id="password" value="Tn123456" required>
                </div>
                <div class="d-grid">
                    <button id="loginBtn" class="btn btn-primary btn-lg bg-primary-custom border-0">เข้าสู่ระบบ</button>
                </div>
            </div>
        </div>
    </div>
    
    <div id="mainDashboard" class="container-main" style="display:none;">
        <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm mb-4 navbar-custom">
            <div class="container-fluid">
                <a class="navbar-brand text-primary-custom" href="#"><i class="bi bi-speedometer2 me-2"></i>แผงควบคุมการเล่นตามบทบาท</a>
                <span class="navbar-text me-3">
                    <i class="bi bi-person-check-fill me-1"></i> ยินดีต้อนรับ, Trainer
                </span>
                <button class="btn btn-outline-danger" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> ออกจากระบบ</button>
            </div>
        </nav>

        <h3 class="mb-3 text-primary-custom"><i class="bi bi-funnel me-2"></i>เครื่องมือค้นหาและกรองข้อมูล</h3>

        <div class="card p-4 mb-4 shadow-sm border-0">
            <div class="row g-3">
                
                <div class="col-md-3">
                    <label for="startDate" class="form-label fw-bold">จากวันที่ (Start Date)</label>
                    <input type="date" class="form-control" id="startDate">
                </div>
                
                <div class="col-md-3">
                    <label for="endDate" class="form-label fw-bold">ถึงวันที่ (End Date)</label>
                    <input type="date" class="form-control" id="endDate">
                </div>

                <div class="col-md-3">
                    <label for="nameFilter" class="form-label fw-bold">ค้นหาด้วยชื่อ TSR</label>
                    <input type="text" class="form-control" id="nameFilter" placeholder="พิมพ์ชื่อ...">
                </div>

                <div class="col-md-3">
                    <label for="userGroupFilter" class="form-label fw-bold">กลุ่มผู้เข้าทำแบบทดสอบ</label>
                    <select class="form-select" id="userGroupFilter">
                        <option value="">-- เลือกกลุ่มทั้งหมด --</option>
                        <option value="Nursery">กลุ่มเนอสเซอรี่</option>
                        <option value="NewTSRsOnboarding">กลุ่ม New TSRs On boarding</option>
                        <option value="NewTSRs">กลุ่ม New TSRs</option>
                        <option value="ExistingTSRs">กลุ่ม TSRs existing</option>
                    </select>
                </div>
            </div>
            
            <div class="row mt-4">
                <div class="col-12 d-grid">
                    <button id="filterBtn" class="btn btn-success btn-lg bg-primary-custom border-0"><i class="bi bi-search me-1"></i> ค้นหาและกรองข้อมูล</button>
                </div>
            </div>
        </div>
        <h3 class="mt-5 mb-3 text-primary-custom"><i class="bi bi-bar-chart-line me-2"></i>สรุปข้อมูล (Key Metrics)</h3>
        <div id="statsSummary" class="row g-4 mb-5">
            </div>
        <h3 class="mt-5 mb-3 text-primary-custom"><i class="bi bi-card-list me-2"></i>รายการไฟล์เสียง</h3>
        <p class="text-muted" id="totalCount">กรุณากดปุ่ม "ค้นหาและกรองข้อมูล" เพื่อเริ่มการค้นหา</p>

        <div id="loadingIndicator" class="text-center my-5" style="display:none;">
            <div class="spinner-border text-primary-custom" role="status">
                <span class="visually-hidden">กำลังโหลด...</span>
            </div>
            <p class="mt-2 text-primary-custom">กำลังดึงรายการไฟล์เสียง...</p>
        </div>

        <div id="submissionsList" class="row g-4">
            <p class="col-12 text-center text-muted">รอคำสั่งกรองข้อมูล...</p>
        </div>

        <div id="messageBox" class="alert alert-danger mt-5" style="display:none;"></div>
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        // --- การกำหนดค่าและความปลอดภัย ---
        const VALID_USER = 'Trainer';
        const VALID_PASS = 'Tn123456';
        const AUTH_KEY = 'roleplay_dashboard_auth';

        // --- Supabase Imports & Config (ใช้ค่าเดิม) ---
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        const supabaseUrl = 'https://wzwyotzzxycqfwercakh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6d3lvdHp6eHljcWZ3ZXJjYWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwNTg3MTMsImV4cCI6MjA3MjYzNDcxM30.lgiAf9oBUqsaWGb3u_80wuoKAODQHE_lIBxpGumhrno'; 
        const supabase = createClient(supabaseUrl, supabaseKey);

        // --- องค์ประกอบ DOM ---
        const loginPage = document.getElementById('loginPage');
        const mainDashboard = document.getElementById('mainDashboard');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginMessage = document.getElementById('loginMessage');
        const filterBtn = document.getElementById('filterBtn');
        const startDateInput = document.getElementById('startDate');
        const endDateInput = document.getElementById('endDate');
        const userGroupFilter = document.getElementById('userGroupFilter'); 
        const nameFilterInput = document.getElementById('nameFilter');
        const submissionsList = document.getElementById('submissionsList');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const totalCountDisplay = document.getElementById('totalCount');
        const messageBox = document.getElementById('messageBox');
        const statsSummary = document.getElementById('statsSummary');
        
        // --- คุณประโยชน์ (Utilities) ---
        function showMessage(message, type = 'danger') {
            messageBox.textContent = message;
            messageBox.className = `alert mt-5 alert-${type}`;
            messageBox.style.display = 'block';
        }

        function formatDateTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('th-TH', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }
        
        // --- ตรรกะการตรวจสอบสิทธิ์ (Auth Logic) ---

        function checkAuth() {
            if (localStorage.getItem(AUTH_KEY) === 'authenticated') {
                showDashboard();
            } else {
                showLogin();
            }
        }

        function showLogin() {
            loginPage.style.display = 'flex';
            mainDashboard.style.display = 'none';
        }

        function showDashboard() {
            loginPage.style.display = 'none';
            mainDashboard.style.display = 'block';
            
            // ตั้งค่าวันที่เริ่มต้นให้เป็นวันนี้ - 30 วัน และวันสิ้นสุดเป็นวันนี้
            if (!startDateInput.value && !endDateInput.value) {
                const today = new Date();
                const pastDate = new Date();
                pastDate.setDate(today.getDate() - 30);
                
                // แปลงเป็น YYYY-MM-DD
                startDateInput.value = pastDate.toISOString().split('T')[0];
                endDateInput.value = today.toISOString().split('T')[0];

                // ✅ Lazy Load: ไม่เรียก loadSubmissions() ที่นี่
            }
            
            // ตั้งค่าข้อความเริ่มต้นสำหรับ Lazy Load
            totalCountDisplay.textContent = 'กรุณากดปุ่ม "ค้นหาและกรองข้อมูล" เพื่อเริ่มการค้นหา';
            submissionsList.innerHTML = '<p class="col-12 text-center text-muted">รอคำสั่งกรองข้อมูล...</p>';
            statsSummary.innerHTML = '';
        }

        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            if (user === VALID_USER && pass === VALID_PASS) {
                localStorage.setItem(AUTH_KEY, 'authenticated');
                loginMessage.style.display = 'none';
                showDashboard();
            } else {
                loginMessage.textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
                loginMessage.style.display = 'block';
            }
        }
        
        function handleLogout() {
            localStorage.removeItem(AUTH_KEY);
            showLogin();
        }

        // --- ส่วนการแสดงผล Summary Stats Card ---

        function renderStats(data) {
            const totalCount = data.length;
            const uniqueGroups = [...new Set(data.map(item => item.user_group).filter(Boolean))].length; 
            
            let latestTime = 'N/A';
            if (data.length > 0) {
                // จัดเรียงข้อมูลเพื่อหาเวลาล่าสุด
                const sorted = data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                latestTime = formatDateTime(sorted[0].created_at);
            }

            // คำนวณจำนวนวันที่อยู่ในช่วงกรอง
            const start = new Date(startDateInput.value);
            const end = new Date(endDateInput.value);
            const diffTime = Math.abs(end - start);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; // +1 เพื่อรวมวันสิ้นสุด
            
            // คำนวณเฉลี่ยต่อวัน (ป้องกันการหารด้วยศูนย์)
            const avgPerDay = (diffDays > 0) ? (totalCount / diffDays).toFixed(2) : 0;


            statsSummary.innerHTML = `
                <div class="col-md-3">
                    <div class="card bg-primary-custom text-white shadow-lg h-100 border-0">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0">ไฟล์เสียงรวม</h5>
                                <i class="bi bi-headset-vr display-5 opacity-50"></i>
                            </div>
                            <p class="display-4 fw-bold mt-2">${totalCount}</p>
                            <small>รายการทั้งหมดที่กรองได้</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-info text-dark shadow-lg h-100 border-0">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0">เฉลี่ยต่อวัน</h5>
                                <i class="bi bi-graph-up display-5 opacity-50"></i>
                            </div>
                            <p class="display-4 fw-bold mt-2">${avgPerDay}</p>
                            <small>รายการเฉลี่ยต่อ ${diffDays} วัน</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-success text-white shadow-lg h-100 border-0">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0">กลุ่มผู้เข้าสอบ</h5>
                                <i class="bi bi-people display-5 opacity-50"></i>
                            </div>
                            <p class="display-4 fw-bold mt-2">${uniqueGroups}</p>
                            <small>กลุ่มที่มีการส่งไฟล์</small>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-light text-dark shadow-lg h-100 border-0">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0 text-dark">อัปเดตล่าสุด</h5>
                                <i class="bi bi-clock-history display-5 opacity-50 text-dark"></i>
                            </div>
                            <p class="h4 fw-bold mt-2 text-dark">${latestTime}</p>
                            <small class="text-secondary">เวลาที่มีการส่งไฟล์ล่าสุด</small>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- ตรรกะการโหลดข้อมูลหลัก (Main Data Logic) ---

        /**
         * ดึงข้อมูลทั้งหมดจากตาราง submissions โดยมีตัวกรองวันที่ กลุ่ม และชื่อ
         */
        async function loadSubmissions() {
            const startDate = startDateInput.value;
            const endDate = endDateInput.value;
            const selectedGroup = userGroupFilter.value;
            const searchName = nameFilterInput.value.trim();
            
            if (!startDate || !endDate) {
                showMessage("กรุณาระบุ 'จากวันที่' และ 'ถึงวันที่' เพื่อค้นหา", "warning");
                submissionsList.innerHTML = '<p class="col-12 text-center text-muted">กรุณาเลือกช่วงวันที่เพื่อดูข้อมูล</p>';
                totalCountDisplay.textContent = 'กรุณาเลือกช่วงวันที่เพื่อดูข้อมูล';
                statsSummary.innerHTML = '';
                return;
            }

            loadingIndicator.style.display = 'block';
            messageBox.style.display = 'none';
            submissionsList.innerHTML = ''; // เคลียร์รายการเก่า
            statsSummary.innerHTML = ''; // เคลียร์ Summary เก่า

            // ปรับวันที่สิ้นสุดให้เป็น 23:59:59 ของวันนั้น
            const endDateTime = endDate + 'T23:59:59.999Z';
            
            // เริ่มต้นการสร้าง Query
            let query = supabase
                .from('submissions')
                .select('*')
                // 1. กรองข้อมูลตามช่วงวันที่
                .gte('created_at', startDate) 
                .lte('created_at', endDateTime) 

            // 2. เพิ่มเงื่อนไขการกรองกลุ่ม (ถ้ามีการเลือกกลุ่มที่ไม่ใช่ค่าว่าง)
            if (selectedGroup) {
                query = query.eq('user_group', selectedGroup);
            }
            
            // 3. เพิ่มเงื่อนไขการกรองชื่อ (ถ้ามีการป้อนชื่อ)
            if (searchName) {
                query = query.ilike('name', `%${searchName}%`);
            }

            // เพิ่มการจัดเรียง
            query = query.order('created_at', { ascending: false }); 
            
            // เริ่มการดึงข้อมูล
            const { data, error } = await query; 

            loadingIndicator.style.display = 'none';

            if (error) {
                console.error('ข้อผิดพลาดในการดึงข้อมูลที่ส่งมา:', error);
                showMessage(`เกิดข้อผิดพลาดในการดึงข้อมูล: ${error.message}.`);
                totalCountDisplay.textContent = 'ไม่สามารถโหลดข้อมูลได้';
                return;
            }
            
            // ✅ แสดง Summary Stats ก่อน
            renderStats(data);
            
            // ✅ แสดงรายการไฟล์เสียง
            renderSubmissions(data);
        }

        /**
         * แสดงข้อมูลไฟล์เสียงที่ดึงมาในรูปแบบ Card
         */
        function renderSubmissions(submissions) {
            totalCountDisplay.textContent = `พบรายการไฟล์เสียงที่ส่งมาแล้วทั้งหมด: ${submissions.length} รายการ`;
            
            if (submissions.length === 0) {
                submissionsList.innerHTML = '<p class="col-12 text-center text-muted">ไม่พบรายการไฟล์เสียงตามเงื่อนไขที่เลือก</p>';
                return;
            }

            submissions.forEach(submission => {
                const submissionTime = formatDateTime(submission.created_at);
                
                const cardHtml = `
                    <div class="col-sm-6 col-lg-4">
                        <div class="card submission-card h-100">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title text-primary-custom fw-bold">${submission.name || 'ไม่ระบุชื่อ'}</h5>
                                <h6 class="card-subtitle mb-3">
                                    <span class="badge rounded-pill bg-secondary me-2"><i class="bi bi-person-fill"></i> ID: ${submission.user_id ? submission.user_id.substring(0, 8) : 'N/A'}...</span>
                                    <span class="badge rounded-pill bg-warning text-dark"><i class="bi bi-flag-fill"></i> Part ${submission.part_number} | ข้อที่ ${submission.question_number}</span>
                                </h6>
                                <p class="card-text flex-grow-1">
                                    <span class="badge bg-dark mb-2">${submission.user_group || 'ไม่ระบุกลุ่ม'}</span><br>
                                    <strong><i class="bi bi-chat-dots me-1"></i> คำถาม:</strong> ${submission.question_text}<br>
                                </p>
                                
                                <div class="audio-player mt-3">
                                    <label class="form-label mb-1 text-primary-custom fw-bold"><i class="bi bi-volume-up-fill me-1"></i> ไฟล์เสียงตอบกลับ:</label>
                                    <audio controls class="w-100">
                                        <source src="${submission.audio_url}" type="audio/webm">
                                        เบราว์เซอร์ของคุณไม่รองรับการเล่นไฟล์เสียง
                                    </audio>
                                </div>
                                <small class="d-block mt-2 text-secondary text-end"><i class="bi bi-clock me-1"></i> ${submissionTime}</small>
                            </div>
                        </div>
                    </div>
                `;
                
                submissionsList.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // --- ตัวรับฟังเหตุการณ์และการเริ่มต้น (Event Listeners and Initialization) ---
        
        loginBtn.addEventListener('click', handleLogin);
        logoutBtn.addEventListener('click', handleLogout);
        filterBtn.addEventListener('click', loadSubmissions);
        
        // เมื่อโหลดหน้าเสร็จ ให้ตรวจสอบสถานะการล็อกอิน
        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
